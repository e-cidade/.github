name: GitHub governance

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply governance changes
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: github-governance
  cancel-in-progress: false

jobs:
  managed-repositories:
    name: Resolve managed repositories
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      repositories: ${{ steps.repositories.outputs.repositories }}

    steps:
      - name: Checkout caller configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve explicitly managed repositories
        id: repositories
        run: |
          repositories="$(
            jq -c '
              [
                .repositories
                | keys[]
                | select(startswith("e-cidade/"))
                | sub("^e-cidade/"; "")
              ]
            ' governance.config.json
          )"

          if [[ "$(jq 'length' <<< "$repositories")" -eq 0 ]]; then
            echo "No managed repositories configured" >&2
            exit 1
          fi

          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"

  reconcile:
    name: ${{ inputs.apply && 'Apply' || 'Plan' }} e-cidade/${{ matrix.repository }}
    needs: managed-repositories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ruleset-sync

    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.managed-repositories.outputs.repositories) }}

    steps:
      - name: Checkout caller configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate GitHub App for repository governance
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RULESET_APP_CLIENT_ID }}
          private-key: ${{ secrets.RULESET_APP_PRIVATE_KEY }}
          owner: e-cidade
          repositories: ${{ matrix.repository }}
          permission-administration: write

      - name: Reconcile repository governance
        uses: LibreCodeCoop/github-governance@3755c14f01c7d544fe89da3a6daf540faa2510ce # v0.2.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: e-cidade/${{ matrix.repository }}
          config: ${{ github.workspace }}/governance.config.json
          apply: ${{ inputs.apply && 'true' || 'false' }}
